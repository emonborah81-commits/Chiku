<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8fa" />
  <meta name="description" content="A little something for Chiku ❤️" />

  <title>A Little Something For Chiku ❤️</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: #fff9fb;
      color: #513c43;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      font: inherit;
    }

    ::selection {
      background: #f7ccd8;
      color: #513c43;
    }

    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {
      --warm-white: #fffaf9;
      --cream: #fff6f3;
      --blush: #fce3e9;
      --pink: #f5b9c9;
      --rose: #d9829b;
      --rose-dark: #b9637d;
      --lavender: #eee7f7;
      --text: #513c43;
      --soft-text: #856d75;
      --white: rgba(255, 255, 255, 0.78);
      --shadow: rgba(177, 103, 126, 0.14);
    }

    /* =========================================================
       OPENING SCREEN
    ========================================================= */

    .opening-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(249, 205, 218, 0.42), transparent 32%),
        radial-gradient(circle at 85% 25%, rgba(232, 220, 246, 0.42), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(255, 225, 220, 0.45), transparent 34%),
        #fffaf9;
      transition:
        opacity 1s ease,
        visibility 1s ease;
    }

    .opening-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .ambient {
      position: absolute;
      border-radius: 50%;
      filter: blur(45px);
      pointer-events: none;
      animation: ambientFloat 8s ease-in-out infinite;
    }

    .ambient.one {
      width: 170px;
      height: 170px;
      top: 8%;
      left: -50px;
      background: rgba(247, 193, 209, 0.32);
    }

    .ambient.two {
      width: 220px;
      height: 220px;
      right: -80px;
      top: 28%;
      background: rgba(224, 211, 241, 0.32);
      animation-delay: -3s;
    }

    .ambient.three {
      width: 190px;
      height: 190px;
      left: 25%;
      bottom: -80px;
      background: rgba(255, 214, 207, 0.28);
      animation-delay: -5s;
    }

    @keyframes ambientFloat {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(0, -18px, 0) scale(1.06);
      }
    }

    /* =========================================================
       PARTICLES
    ========================================================= */

    .particle-field,
    .heart-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(214, 130, 154, 0.38);
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      from {
        transform: translateY(110vh) scale(0.5);
        opacity: 0;
      }
      15% {
        opacity: 0.7;
      }
      80% {
        opacity: 0.5;
      }
      to {
        transform: translateY(-20vh) scale(1);
        opacity: 0;
      }
    }

    .floating-heart {
      position: absolute;
      color: rgba(213, 121, 148, 0.34);
      font-size: 15px;
      animation: heartFloat linear infinite;
    }

    @keyframes heartFloat {
      from {
        transform: translateY(110vh) rotate(-8deg);
        opacity: 0;
      }
      15% {
        opacity: 0.6;
      }
      75% {
        opacity: 0.45;
      }
      to {
        transform: translateY(-15vh) rotate(12deg);
        opacity: 0;
      }
    }

    /* =========================================================
       OPENING CONTENT
    ========================================================= */

    .opening-content {
      position: relative;
      z-index: 5;
      width: min(90%, 430px);
      text-align: center;
      padding: 24px;
      animation: openingAppear 1.2s ease both;
    }

    @keyframes openingAppear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .opening-label {
      margin-bottom: 34px;
      color: #876d76;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-style: italic;
      letter-spacing: 0.3px;
    }

    /* =========================================================
       ENVELOPE
    ========================================================= */

    .envelope-wrap {
      position: relative;
      width: min(310px, 82vw);
      height: 220px;
      margin: 0 auto 36px;
      perspective: 1000px;
    }

    .envelope {
      position: absolute;
      left: 50%;
      bottom: 10px;
      width: 100%;
      height: 175px;
      transform: translateX(-50%);
      transform-style: preserve-3d;
      filter: drop-shadow(0 18px 28px rgba(160, 91, 113, 0.16));
      transition: transform 1.2s cubic-bezier(.2,.8,.2,1);
    }

    .envelope-body {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 16px;
      background:
        linear-gradient(145deg, #fffafa, #fbe7eb);
      border: 1px solid rgba(217, 130, 155, 0.28);
    }

    .envelope-body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(145deg,
          transparent 49.5%,
          rgba(213, 126, 149, 0.18) 50%,
          transparent 50.5%);
    }

    .envelope-body::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(35deg,
          transparent 49.5%,
          rgba(213, 126, 149, 0.15) 50%,
          transparent 50.5%);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 4;
      width: 100%;
      height: 105px;
      transform-origin: top center;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background:
        linear-gradient(135deg, #fbe0e6, #f8ccd8);
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
      transition:
        transform 1.1s cubic-bezier(.2,.8,.2,1),
        z-index 0s linear 0.55s;
    }

    .letter-preview {
      position: absolute;
      z-index: 2;
      left: 8%;
      bottom: 6px;
      width: 84%;
      height: 120px;
      border-radius: 12px;
      background: #fffdfc;
      box-shadow: 0 4px 12px rgba(160, 91, 113, 0.09);
      transform: translateY(45px);
      transition: transform 1.2s cubic-bezier(.2,.8,.2,1);
    }

    .letter-preview::before {
      content: "♥";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: #d9829b;
      font-size: 25px;
    }

    .envelope.opening {
      transform: translateX(-50%) translateY(8px) scale(0.96);
    }

    .envelope.opening .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope.opening .letter-preview {
      transform: translateY(-55px);
    }

    .opening-heart {
      position: absolute;
      z-index: 8;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #cc6f8b;
      font-size: 25px;
      transition: opacity 0.5s ease;
    }

    .envelope.opening .opening-heart {
      opacity: 0;
    }

    /* =========================================================
       OPEN BUTTON
    ========================================================= */

    .open-button {
      position: relative;
      min-width: 170px;
      padding: 14px 25px;
      border: 1px solid rgba(207, 111, 140, 0.25);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #a95c76;
      box-shadow:
        0 10px 30px rgba(186, 101, 128, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.3px;
      backdrop-filter: blur(10px);
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .open-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 35px rgba(186, 101, 128, 0.17),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .open-button:active {
      transform: scale(0.96);
    }

    .open-button:focus-visible {
      outline: 3px solid rgba(217, 130, 155, 0.3);
      outline-offset: 4px;
    }

    /* =========================================================
       MAIN WEBSITE
    ========================================================= */

    .website {
      min-height: 100vh;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 1.2s ease, visibility 1.2s ease;
      background:
        radial-gradient(circle at 10% 10%, rgba(250, 218, 226, 0.24), transparent 25%),
        radial-gradient(circle at 90% 20%, rgba(232, 222, 244, 0.22), transparent 25%),
        #fffaf9;
    }

    .website.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;
      min-height: 92vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(80px + env(safe-area-inset-top))
        22px
        70px;
      overflow: hidden;
      text-align: center;
    }

    .hero-glow {
      position: absolute;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      background: rgba(248, 201, 216, 0.23);
      filter: blur(65px);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
    }

    .eyebrow {
      margin-bottom: 18px;
      color: #a87584;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1s 0.2s ease forwards;
    }

    .hero-title {
      color: #593f47;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 12vw, 76px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -1.5px;
      opacity: 0;
      animation: fadeUp 1s 0.45s ease forwards;
    }

    .hero-subtitle {
      margin-top: 18px;
      color: #806a72;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(18px, 4.5vw, 23px);
      font-style: italic;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 1s 0.7s ease forwards;
    }

    .scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: #ae8994;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      animation:
        fadeUp 1s 1.1s ease forwards,
        gentleFloat 2.8s 2s ease-in-out infinite;
    }

    .scroll-line {
      width: 1px;
      height: 28px;
      margin: 10px auto 0;
      background: linear-gradient(to bottom, #d28ca2, transparent);
    }

    @keyframes gentleFloat {
      0%, 100% {
        margin-bottom: 0;
      }
      50% {
        margin-bottom: 7px;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       LETTER SECTION
    ========================================================= */

    .letter-section {
      position: relative;
      padding: 20px 16px 90px;
    }

    .letter-container {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .letter-paper {
      position: relative;
      padding: 36px 21px 48px;
      border: 1px solid rgba(213, 137, 158, 0.18);
      border-radius: 24px;
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.93),
          rgba(255, 249, 248, 0.94)
        );
      box-shadow:
        0 24px 65px rgba(176, 102, 125, 0.10),
        0 3px 12px rgba(176, 102, 125, 0.05);
    }

    .paper-top {
      text-align: center;
      margin-bottom: 38px;
    }

    .paper-heart {
      display: inline-flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      border-radius: 50%;
      background: rgba(248, 216, 225, 0.58);
      color: #c87891;
      font-size: 19px;
    }

    .paper-title {
      color: #654b53;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 500;
    }

    .paper-divider {
      width: 65px;
      height: 1px;
      margin: 17px auto 0;
      background: linear-gradient(
        to right,
        transparent,
        #d997aa,
        transparent
      );
    }

    /* =========================================================
       PARAGRAPHS
    ========================================================= */

    .letter-text {
      color: #5c4a50;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.95;
      letter-spacing: 0.05px;
    }

    .letter-paragraph {
      margin-bottom: 27px;
      opacity: 0;
      transform: translateY(25px);
      transition:
        opacity 0.9s ease,
        transform 0.9s ease;
    }

    .letter-paragraph.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .letter-paragraph:last-child {
      margin-bottom: 0;
    }

    .mini-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 34px 0;
      color: #d18ba1;
      opacity: 0.7;
    }

    .mini-divider::before,
    .mini-divider::after {
      content: "";
      width: 55px;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(209, 139, 161, 0.55)
      );
    }

    .mini-divider::after {
      transform: rotate(180deg);
    }

    .mini-divider span {
      font-size: 12px;
    }

    /* =========================================================
       EMOTIONAL HIGHLIGHTS
    ========================================================= */

    .highlight {
      position: relative;
      margin: 35px -4px;
      padding: 23px 19px;
      border-radius: 19px;
      background:
        linear-gradient(
          135deg,
          rgba(252, 229, 235, 0.58),
          rgba(242, 235, 249, 0.42)
        );
      border: 1px solid rgba(217, 142, 164, 0.14);
      box-shadow: 0 12px 35px rgba(185, 111, 135, 0.07);
      color: #65454f;
      text-align: center;
      font-size: 18px;
      line-height: 1.7;
    }

    .highlight::before {
      content: "♡";
      display: block;
      margin-bottom: 6px;
      color: #d07b96;
      font-size: 20px;
    }

    /* =========================================================
       FINAL SECTION
    ========================================================= */

    .final-section {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        90px 22px
        calc(100px + env(safe-area-inset-bottom));
      overflow: hidden;
      text-align: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(249, 210, 222, 0.35), transparent 28%),
        radial-gradient(circle at 80% 75%, rgba(231, 220, 244, 0.35), transparent 30%),
        #fffaf9;
    }

    .final-content {
      position: relative;
      z-index: 2;
      width: min(100%, 600px);
    }

    .final-small {
      color: #aa7b88;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease;
    }

    .final-title {
      color: #60434c;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(31px, 8vw, 51px);
      font-weight: 500;
      line-height: 1.25;
      opacity: 0;
      transform: translateY(25px);
      transition: all 1s 0.15s ease;
    }

    .final-message {
      margin: 27px auto 0;
      color: #806a72;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.8;
      opacity: 0;
      transform: translateY(25px);
      transition: all 1s 0.3s ease;
    }

    .final-signature {
      margin-top: 36px;
      color: #b46b82;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-style: italic;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s 0.45s ease;
    }

    .final-love {
      margin-top: 31px;
      color: #b45e78;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 7vw, 40px);
      line-height: 1.35;
      font-weight: 500;
      opacity: 0;
      transform: translateY(25px) scale(0.98);
      transition: all 1.2s 0.6s ease;
    }

    .final-section.revealed .final-small,
    .final-section.revealed .final-title,
    .final-section.revealed .final-message,
    .final-section.revealed .final-signature,
    .final-section.revealed .final-love {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* =========================================================
       MUSIC CONTROL
    ========================================================= */

    .music-control {
      position: fixed;
      z-index: 9000;
      right: 17px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      width: 49px;
      height: 49px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(208, 126, 149, 0.2);
      border-radius: 50%;
      background: rgba(255, 250, 250, 0.84);
      color: #b7647d;
      box-shadow:
        0 9px 28px rgba(169, 91, 114, 0.15),
        inset 0 1px 0 rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.8);
      transition:
        opacity 0.5s ease,
        visibility 0.5s ease,
        transform 0.5s ease,
        box-shadow 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .music-control.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .music-control:hover {
      box-shadow:
        0 12px 32px rgba(169, 91, 114, 0.20),
        inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .music-control:active {
      transform: scale(0.91);
    }

    .music-icon {
      font-size: 19px;
      line-height: 1;
    }

    .music-control.playing {
      animation: musicPulse 2.2s ease-in-out infinite;
    }

    @keyframes musicPulse {
      0%, 100% {
        box-shadow:
          0 9px 28px rgba(169, 91, 114, 0.15),
          inset 0 1px 0 rgba(255,255,255,0.9);
      }
      50% {
        box-shadow:
